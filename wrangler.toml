name = "dollar-course"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Worker manzilini yoqish: https://dollar-course.<subdomen>.workers.dev
workers_dev = true

# Oddiy (maxfiy bo'lmagan) sozlamalar. Bu yerda yozilmasa, har deploy'da o'chib ketadi.
[vars]
ADMIN_ID = "1295718505"   # /stat va bepul Premium faqat shu Telegram ID uchun
PREMIUM_PRICE = "49"        # Premium oylik narxi, Telegram Stars (30 kunlik avtomatik obuna)
PREMIUM_YEAR_PRICE = "489"  # Premium yillik narxi, Telegram Stars (365 kun, bir martalik to'lov)

# Har kuni Toshkent vaqti bilan 8:00–8:59 oralig'ida har daqiqada (UTC 03:xx).
# Har ishga tushishda bugun xabar olmagan obunachilarning bir guruhiga yuboriladi.
[triggers]
crons = ["* 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "dollar-course-db"
database_id = "ca33d2f7-6f3d-4766-925b-1cf17ec3fa8f"

[observability]
enabled = true
